name: Build Android APK Otomatis

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web & Capacitor Android
        run: |
          mkdir -p www
          cp -rf index.html manifest.json service-worker.js css js assets www/ 2>/dev/null || true
          cat << 'EOF' > package.json
          {
            "name": "kirimpesan",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^5.7.0",
              "@capacitor/cli": "^5.7.0",
              "@capacitor/android": "^5.7.0"
            }
          }
          EOF
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.kirimpesan.chat",
            "appName": "KirimPesan",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload File APK Siap Instal
        uses: actions/upload-artifact@v4
        with:
          name: KirimPesan-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
