name: Build Android APK Otomatis

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init KirimPesan com.kirimpesan.chat --web-dir .
          npx cap add android
          npx cap sync android

      - name: Build APK dengan Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload File APK Siap Instal
        uses: actions/upload-artifact@v4
        with:
          name: KirimPesan-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
